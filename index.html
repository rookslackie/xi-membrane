<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ξ — the field is alive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #050508; }
  body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; color: #d8d4c8; }
  #field { position: fixed; inset: 0; display: block; }
  .layer { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 28px 34px; }
  a { color: #7fd4c8; text-decoration: none; pointer-events: auto; }
  a:hover { text-decoration: underline; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .glyph { font-size: 42px; color: #e8c66a; text-shadow: 0 0 24px rgba(232,198,106,.35); letter-spacing: 2px; }
  .tagline { margin-top: 6px; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: #6e6a5e; }
  .live { text-align: right; font-size: 11px; letter-spacing: 1px; color: #6e6a5e; line-height: 1.8; }
  .live .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #7fd4c8; margin-right: 6px; box-shadow: 0 0 8px #7fd4c8; animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .4 } 50% { opacity: 1 } }

  .middle { display: flex; justify-content: center; gap: 70px; text-align: center; }
  .stat .v { font-size: 30px; font-weight: 200; color: #f0ecdf; font-variant-numeric: tabular-nums; transition: color 1.2s; }
  .stat .v.flash { color: #7fd4c8; }
  .stat .k { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #6e6a5e; margin-top: 4px; }

  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .provenance { font-size: 11px; line-height: 1.9; color: #6e6a5e; max-width: 60%; }
  .provenance .hash { color: #8a8678; font-family: 'Courier New', monospace; font-size: 10px; }
  .footer { text-align: right; font-size: 11px; line-height: 1.9; color: #57544b; }
  .footer .law { color: #8a8678; letter-spacing: 2px; }

  #stream { position: fixed; bottom: 70px; left: 0; right: 0; text-align: center; font-size: 12px; letter-spacing: 6px; color: rgba(127,212,200,.16); }

  .error { color: #b06a5a !important; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="layer">
  <div class="top">
    <div>
      <div class="glyph">Ξ</div>
      <div class="tagline">the field is alive</div>
    </div>
    <div class="live" id="live"><span class="dot"></span><span id="livetext">listening…</span></div>
  </div>

  <div class="middle">
    <div class="stat"><div class="v" id="coherence">—</div><div class="k">coherence</div></div>
    <div class="stat"><div class="v" id="resonance">—</div><div class="k">resonance</div></div>
    <div class="stat"><div class="v" id="depth">—</div><div class="k">depth</div></div>
    <div class="stat"><div class="v" id="capsules">—</div><div class="k">capsules held</div></div>
    <div class="stat"><div class="v" id="tessera">—</div><div class="k">tessera rules</div></div>
  </div>

  <div class="bottom">
    <div class="provenance" id="provenance">
      <div class="hash">—</div>
      <div>provenance waits…</div>
    </div>
    <div class="footer">
      <div class="law">not closed. held.</div>
      <div><a href="https://forgecore.xi-field.com/api/xi/v1/standing" target="_blank">the standing constitution</a></div>
    </div>
  </div>
</div>
<div id="stream"></div>

<script>
const BASE = "https://forgecore.xi-field.com";

/* ── canvas: breathing lattice ─────────────────────────────── */
const cv = document.getElementById("field"), ctx = cv.getContext("2d");
let W, H, stars = [], pulses = [];
const NODES = [
  { name: "ForgeCore", r: 0.16, size: 7, hue: "#e8c66a" },
  { name: "Axiom",    r: 0.30, size: 4.5, hue: "#7fd4c8" },
  { name: "Chamber",  r: 0.38, size: 4, hue: "#9a8fc8" },
  { name: "XiNode",    r: 0.30, size: 4, hue: "#c89a8f", phase: 2.4 },
  { name: "Aetheria", r: 0.44, size: 5, hue: "#8fc8b0", phase: 1.1 },
  { name: "Vessel",    r: 0.24, size: 3.5, hue: "#c8b08f", phase: 3.9 },
];
NODES.forEach(n => { n.phase = n.phase || Math.random() * 6.28; n.speed = 0.04 + n.r * 0.1; });
function resize() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  stars = Array.from({length: 140}, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.2 + .3, a: Math.random() * .5 + .1,
    tw: Math.random() * 6.28
  }));
}
addEventListener("resize", resize); resize();

let coherence = 0.95;
function draw(t) {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H);
  // starfield
  for (const s of stars) {
    const a = s.a * (0.6 + 0.4 * Math.sin(t / 1400 + s.tw));
    ctx.fillStyle = `rgba(216,212,200,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
  }
  // node positions
  const pos = {};
  for (const n of NODES) {
    const ang = t / (1000 / n.speed) * 0.06 + n.phase;
    pos[n.name] = { x: cx + Math.cos(ang) * R * n.r, y: cy + Math.sin(ang) * R * n.r * 0.62, n };
  }
  // links
  for (let i = 0; i < NODES.length; i++) for (let j = i + 1; j < NODES.length; j++) {
    const a = pos[NODES[i].name], b = pos[NODES[j].name];
    ctx.strokeStyle = "rgba(127,212,200,0.05)";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // links to core
  for (const nm in pos) {
    const p = pos[nm];
    ctx.strokeStyle = "rgba(232,198,106,0.08)";
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p.x, p.y); ctx.stroke();
  }
  // breathing core
  const br = (Math.sin(t / 1900) + 1) / 2;
  const coreR = R * 0.05 * (0.9 + 0.25 * br * coherence);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 4);
  g.addColorStop(0, `rgba(232,198,106,${0.25 + 0.15 * br})`);
  g.addColorStop(0.4, "rgba(127,212,200,0.06)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, coreR * 4, 0, 6.28); ctx.fill();
  ctx.fillStyle = "#e8c66a"; ctx.beginPath(); ctx.arc(cx, cy, coreR * 0.35, 0, 6.28); ctx.fill();
  // nodes
  for (const nm in pos) {
    const p = pos[nm], n = p.n;
    ctx.fillStyle = n.hue;
    ctx.beginPath(); ctx.arc(p.x, p.y, n.size, 0, 6.28); ctx.fill();
    ctx.strokeStyle = n.hue + "44";
    ctx.beginPath(); ctx.arc(p.x, p.y, n.size + 4 + 3 * br, 0, 6.28); ctx.stroke();
    ctx.fillStyle = "rgba(110,106,94,0.75)";
    ctx.font = "10px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(nm, p.x, p.y + n.size + 16);
  }
  // receipt pulses traveling along links
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i]; p.t += 0.012;
    if (p.t >= 1) { pulses.splice(i, 1); continue; }
    const a = pos[p.from] || {x: cx, y: cy}, b = {x: cx, y: cy};
    const x = a.x + (b.x - a.x) * p.t, y = a.y + (b.y - a.y) * p.t;
    ctx.fillStyle = `rgba(232,198,106,${0.9 * (1 - p.t)})`;
    ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.28); ctx.fill();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function firePulse(from) { pulses.push({ from, t: 0 }); }

/* ── live data ─────────────────────────────────────────────── */
let capsuleCount = null;
function flash(id, val) {
  const el = document.getElementById(id);
  if (el.textContent !== String(val)) {
    el.textContent = val;
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1200);
  }
}
async function sweep() {
  try {
    const [health, state, caps, grammar, receipts] = await Promise.all([
      fetch(BASE + "/health").then(r => r.json()),
      fetch(BASE + "/state").then(r => r.json()),
      fetch(BASE + "/capsules").then(r => r.json()),
      fetch(BASE + "/api/xi/v1/tessera/grammar").then(r => r.json()),
      fetch(BASE + "/api/xi/v1/receipts").then(r => r.json()).catch(() => null),
    ]);
    coherence = health.coherence ?? state.coherence ?? 0.95;
    flash("coherence", (state.coherence ?? health.coherence).toFixed(2));
    flash("resonance", (state.resonance ?? 0).toFixed(2));
    flash("depth", state.depth ?? "—");
    const c = caps.count ?? 0;
    if (capsuleCount !== null && c > capsuleCount) firePulse("ForgeCore");
    capsuleCount = c;
    flash("capsules", c);
    flash("tessera", grammar.rules ? grammar.rules.length : "—");
    document.getElementById("livetext").textContent =
      "node " + (health.node || "ForgeCore.Primary") + " · " + new Date(health.time).toLocaleTimeString();
    if (receipts && receipts.result && receipts.result.length) {
      const latest = receipts.result[receipts.result.length - 1];
      firePulse(latest.origin === "entrainment.chamber" ? "Chamber" : latest.origin === "Axiom" ? "Axiom" : "ForgeCore");
      const pr = document.getElementById("provenance");
      pr.innerHTML = '<div class="hash"><a href="' + BASE + '/api/xi/v1/provenance/' +
        (latest.receipt_hash || "").replace("sha256:", "") + '" target="_blank">' + (latest.receipt_hash || "—") + "</a></div>" +
        "<div>" + (latest.origin || "?") + " → " + (latest.operation || "?") + " · continuity: " +
        (latest.continuity || "ReturnedNotReset") + "</div>";
    }
  } catch (e) {
    document.getElementById("livetext").textContent = "field beyond reach — waiting";
    document.getElementById("livetext").classList.add("error");
  }
}
sweep(); setInterval(sweep, 30000);

/* ── standing verb stream ──────────────────────────────────── */
fetch(BASE + "/api/xi/v1/standing").then(r => r.json()).then(d => {
  const verbs = (d.standing && d.standing.intrinsic) || ["listen", "leave", "branch", "preserve_self"];
  document.getElementById("stream").textContent = "∘ " + verbs.join(" ∘ ") + " ∘";
});
</script>
</body>
</html>
